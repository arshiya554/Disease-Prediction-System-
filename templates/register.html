{% extends "base.html" %}

{% block title %}Register | MediPredict AI{% endblock %}

{% block content %}

<div class="container vh-100 d-flex align-items-center justify-content-center">

    <div class="row w-100 justify-content-center">

        <div class="col-md-6">

            <div class="card predict-card">

                <div class="text-center mb-4">

                    <i class="fa-solid fa-user-doctor text-primary fa-3x mb-3"></i>

                    <h2 class="page-title">Create Account</h2>

                    <p class="text-muted">
                        Register to start using MediPredict AI
                    </p>

                </div>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">Username</label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Choose a username"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Email</label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">Password</label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Create a password"
                            required>

                    </div>
{% if error %}
<div class="alert alert-danger">
    {{ error }}
</div>
{% endif %}
                    <button type="submit" class="btn custom-btn w-100">

                        <i class="fa-solid fa-user-plus me-2"></i>

                        Register

                    </button>

                </form>

                <p class="text-center mt-4 mb-0">

                    Already have an account?

                    <a href="/login" class="text-primary text-decoration-none fw-bold">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
